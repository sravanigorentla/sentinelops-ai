services:
  - type: web
    name: sentinelops-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "80"

  - type: web
    name: sentinelops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sentinelops-db
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: sentinelops-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: redis
          name: sentinelops-redis
          property: port
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: sentinelops-ai-service
          property: host
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: sentinelops-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: INFO

  - type: redis
    name: sentinelops-redis
    region: oregon
    plan: free

databases:
  - name: sentinelops-db
    databaseName: sentinelops
    user: sentinelops
    region: oregon
    plan: free
